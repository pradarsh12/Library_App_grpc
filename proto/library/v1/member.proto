syntax = "proto3";

package library.v1;

import "google/protobuf/timestamp.proto";
import "library/v1/common.proto";

message Member {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string address = 6;
  MemberStatus status = 7;
  google.protobuf.Timestamp joined_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateMemberRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string phone = 4;
  string address = 5;
}

message UpdateMemberRequest {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string address = 6;
  MemberStatus status = 7;
}

message GetMemberRequest {
  int64 id = 1;
}

message ListMembersRequest {
  // Case-insensitive match against name or email. Empty = no filter.
  string search = 1;
  PageRequest page = 2;
}

message ListMembersResponse {
  repeated Member members = 1;
  PageResponse page = 2;
}

service MemberService {
  rpc CreateMember(CreateMemberRequest) returns (Member);
  rpc UpdateMember(UpdateMemberRequest) returns (Member);
  rpc GetMember(GetMemberRequest) returns (Member);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
}
