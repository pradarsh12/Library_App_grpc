[project]
name = "library-app"
version = "0.1.0"
description = "Neighborhood Library Service — async gRPC backend for books, members, and borrow/return operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio==1.83.1",
    "grpcio-tools==1.83.1",
    "grpcio-reflection==1.83.1",
    "grpcio-health-checking==1.83.1",
    "protobuf==7.36.0",
    "asyncpg==0.31.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "server",
    "server.api",
    "server.db",
    "server.domain",
    "server.repositories",
    "server.services",
    "library",
    "library.v1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
